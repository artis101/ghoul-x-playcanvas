<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GHOUL-X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app-root">
      <canvas id="playcanvas-viewport"></canvas>

      <!-- IN-GAME FPS HUD LAYER (100% NON-BLOCKING) -->
      <div id="fps-hud" class="fps-hud">
        <!-- FLOATING 3D-PROJECTED ENEMY HEALTH & TRIAGE PLATES -->
        <div id="hud-world-triage-layer" class="hud-world-triage-layer"></div>

        <!-- TOP-CENTER FOCUSED TARGET HEALTH BAR & TRIAGE OVERLAY -->
        <div id="hud-target-triage-card" class="hud-target-triage-card hidden">
          <div class="ttc-top-row">
            <span id="hud-target-name" class="ttc-name">HOSTILE</span>
            <span id="hud-target-triage-badge" class="ttc-badge triage-healthy">HEALTHY</span>
          </div>
          <div class="ttc-hp-row">
            <div class="ttc-hp-track">
              <div id="hud-target-hp-fill" class="ttc-hp-fill triage-healthy"></div>
            </div>
            <span id="hud-target-hp-text" class="ttc-hp-text">135 / 135</span>
          </div>
          <div id="hud-target-armor-track" class="ttc-armor-track hidden">
            <div id="hud-target-armor-fill" class="ttc-armor-fill"></div>
          </div>
        </div>

        <!-- CENTER CROSSHAIR, HITMARKER & SNIPER OPTIC -->
        <div id="reticle-layer" class="reticle-layer">
          <div id="crosshair-standard" class="crosshair-standard">
            <span class="ch-line ch-top"></span>
            <span class="ch-line ch-right"></span>
            <span class="ch-line ch-bottom"></span>
            <span class="ch-line ch-left"></span>
            <span class="ch-dot"></span>
            <span id="shotgun-spread-ring" class="shotgun-spread-ring"></span>

            <div id="hitmarker" class="hitmarker">
              <span class="hm-tick hm-tl"></span>
              <span class="hm-tick hm-tr"></span>
              <span class="hm-tick hm-bl"></span>
              <span class="hm-tick hm-br"></span>
            </div>
          </div>

          <div id="sniper-scope-mask" class="sniper-scope-mask hidden">
            <div class="scope-mil-dots-h"></div>
            <div class="scope-mil-dots-v"></div>
            <div class="scope-telemetry-readout">
              <span id="scope-zoom-label">4.0x</span>
              <span id="scope-range-label">42m</span>
              <span id="scope-drop-label">DROP 0cm</span>
            </div>
          </div>
        </div>

        <!-- TOP-RIGHT FADING KILL / IMPACT FEED -->
        <div id="hud-killfeed" class="hud-killfeed"></div>

        <!-- CENTER CONTEXT PROMPT (ONLY WHEN UNLOCKED OR WAVE CLEAR) -->
        <div id="hud-prompt" class="hud-prompt">
          CLICK TO ENGAGE &nbsp;•&nbsp; WASD MOVE &nbsp;•&nbsp; RMB ADS &nbsp;•&nbsp; 1-4 WEAPON &nbsp;•&nbsp; B AMMO &nbsp;•&nbsp; R RELOAD &nbsp;•&nbsp; T NEW WAVE
        </div>

        <!-- BOTTOM-LEFT: CLASSIC FPS HEALTH & ARMOR -->
        <div class="hud-corner hud-bottom-left">
          <div class="vital-block">
            <span class="vital-icon vital-cross">+</span>
            <div class="vital-data">
              <span id="hud-health-val" class="vital-num">100</span>
              <span class="vital-bar"><span class="vital-bar-fill health-fill"></span></span>
            </div>
          </div>
          <div class="vital-block">
            <span class="vital-icon vital-shield">⛨</span>
            <div class="vital-data">
              <span id="hud-armor-val" class="vital-num armor-num">100</span>
              <span class="vital-bar"><span class="vital-bar-fill armor-fill"></span></span>
            </div>
          </div>
        </div>

        <!-- BOTTOM-RIGHT: WEAPON, MAGAZINE / RESERVE AMMO & SLOTS -->
        <div class="hud-corner hud-bottom-right">
          <div class="ammo-counter-row">
            <span id="hud-mag-count" class="ammo-mag">08</span>
            <span class="ammo-sep">/</span>
            <span id="hud-reserve-count" class="ammo-reserve">32</span>
          </div>
          <div class="weapon-meta-row">
            <span id="hud-weapon-name" class="weapon-name">BESERKER 12G</span>
            <span id="hud-ammo-caliber" class="ammo-caliber">12G 00 BUCK</span>
          </div>
          <div id="hud-weapon-slots" class="weapon-slots">
            <span class="slot-pip active" data-slot="0">1</span>
            <span class="slot-pip" data-slot="1">2</span>
            <span class="slot-pip" data-slot="2">3</span>
            <span class="slot-pip" data-slot="3">4</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
